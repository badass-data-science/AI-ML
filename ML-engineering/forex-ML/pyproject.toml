[project]
name = "forex-ml-training"
version = "0.1.0"
description = "LSTM training pipeline for Forex time series data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyspark>=3.5",
    "tensorflow[and-cuda]>=2.16",
    "keras>=3.0",
    "mlflow>=2.14",
    "prefect>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "etl-forex-time-series-data",
    "python-tools-and-shortcuts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "dvc>=3.50",
]

[tool.uv.sources]
etl-forex-time-series-data = { path = "../../../../ETL-forex-time-series-data", editable = true }
python-tools-and-shortcuts = { path = "../../../python-tools-and-shortcuts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: real (non-mocked) integration tests that need Docker (e.g. InfluxDB); excluded from the default run, invoke with `-m integration`",
]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks_legacy"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forex_ml"]
