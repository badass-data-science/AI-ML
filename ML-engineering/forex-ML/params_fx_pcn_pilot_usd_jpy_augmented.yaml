# Single source of truth for the forex-ML pipeline.
# Read and validated by forex_ml.config.load_params(); also read directly by
# dvc.yaml so pipeline cache-invalidation and application config never drift apart.

feature:
  # Defaults mirror forex.eda.eda_config.instrument_list / granularity_list; override
  # per-invocation via CLI flags rather than editing this list for a one-off run.
  instruments:
    - AUD/USD
    - EUR/USD
    - GBP/USD
    - NZD/USD
    - USD/CAD
    - USD/CHF
    - USD/JPY
  granularities:
    - H1
    - M15
  n_back: 200
  lookahead: 4
  # 96 added (2026-07-14) -- ~4 trading days at H1, a longer-horizon baseline the
  # existing 12/30/50 lookbacks (all <=~2 days) don't cover. Feeds both a
  # multi-timeframe trend signal (return_MA_96) and the long leg of
  # volatility_regime_ratio below (see add_volatility_regime_features).
  ma_lookback_list: [12, 30, 50, 96]
  columns_base: [mid_open, mid_high, mid_low, mid_close, spread_close, volume]
  ma_columns_list: [volatility, return, diff_spread_close, diff_volume]
  training_and_testing: true
  min_training_timestamp: "2015-01-01T00:00:00"
  output_dir: output
  include_daily_trend: true
  include_hurst: true
  include_fx_pcn: true

split:
  # Triple-barrier labeling (forex_ml/data/triple_barrier.py) replaced the old
  # fixed-horizon column_y/class_cutoff_percentiles scheme -- see README "Cost-aware
  # labeling (triple barrier)". NONE of the four values below have been empirically
  # validated yet (the way n_back=200 was, via real ACF/PACF diagnostics) -- they're
  # starting points to revisit once there's a real look at this pair's move-size
  # distribution, not a considered final answer.
  profit_take_pct: 0.3
  stop_loss_pct: 0.3
  max_holding_bars: 24  # a full day at H1 -- gives barriers real room to be hit
                        # rather than almost always timing out, unlike the old
                        # lookahead=4 fixed-horizon window
  swap_cost_pct_per_night: 0.0  # FALLBACK only -- split_flow.py/rolling_cv.py now
                                # prefer a real, live rate from forex-etl's
                                # swap-rate measurement (see
                                # forex_ml/data/swap_rates.py), falling back to
                                # this constant only if no live snapshot exists
                                # yet for the pair being trained
  # return_MA_96/volatility_MA_96/volatility_regime_ratio added (2026-07-14) --
  # multi-timeframe trend + volatility-regime features, see add_volatility_regime_features.
  # return_sma_crossover/return_zscore_12/rsi_12 added (2026-07-14) -- stationarity-safe
  # MACD/Bollinger/RSI analogs, see add_momentum_features.
  # usd_strength_return added (2026-07-14) -- cross-pair broad-dollar-strength
  # proxy, see compute_cross_pair_usd_strength/add_cross_pair_features.
  columns_x: [volatility, return, diff_spread_close, diff_volume, day_sin, day_cos, is_tokyo_session, is_london_session, is_new_york_session, is_london_new_york_overlap, return_MA_96, volatility_MA_96, volatility_regime_ratio, return_sma_crossover, return_zscore_12, rsi_12, usd_strength_return, daily_return_ma, daily_volatility_ma, hurst_exponent, fxpcn_network_mean_abs_partial_corr, fxpcn_degree, fxpcn_directed_out_count, fxpcn_directed_in_count]
  train_val_proportion: [0.7, 0.15]

# Cross product of feature.instruments x feature.granularities, spelled out because
# DVC's `foreach` takes a single list, not a cross-product of two lists. `key` is the
# slash-free form of `instrument` used in output filenames (see forex_ml/paths.py);
# n_back/lookahead are deliberately NOT duplicated here — dvc.yaml interpolates those
# straight from `feature.n_back` / `feature.lookahead` below so there's still exactly
# one place that sets them. If you add/remove an instrument or granularity above,
# update this list to match.
pairs:
  - {instrument: AUD/USD, key: AUD_USD, granularity: H1}
  - {instrument: AUD/USD, key: AUD_USD, granularity: M15}
  - {instrument: EUR/USD, key: EUR_USD, granularity: H1}
  - {instrument: EUR/USD, key: EUR_USD, granularity: M15}
  - {instrument: GBP/USD, key: GBP_USD, granularity: H1}
  - {instrument: GBP/USD, key: GBP_USD, granularity: M15}
  - {instrument: NZD/USD, key: NZD_USD, granularity: H1}
  - {instrument: NZD/USD, key: NZD_USD, granularity: M15}
  - {instrument: USD/CAD, key: USD_CAD, granularity: H1}
  - {instrument: USD/CAD, key: USD_CAD, granularity: M15}
  - {instrument: USD/CHF, key: USD_CHF, granularity: H1}
  - {instrument: USD/CHF, key: USD_CHF, granularity: M15}
  - {instrument: USD/JPY, key: USD_JPY, granularity: H1}
  - {instrument: USD/JPY, key: USD_JPY, granularity: M15}

train:
  # Reduced from [300, 300, 300, 300, 300] (2026-07-10) after a rolling-CV depth
  # comparison (3 folds each, width held fixed at 300, EUR/USD H1) -- 3 layers beat
  # BOTH 5 and 2 layers, not just 5: 5 layers barely cleared (arguably lost to) the
  # majority-class baseline (LSTM mean accuracy 0.367 vs baseline 0.368) with real
  # fold-to-fold noise (std 0.045); 2 layers was worse than baseline (0.346) and
  # far less consistent (std 0.075, one fold at 0.264, another at 0.413); 3 layers
  # clearly beat the baseline (0.379) with the tightest spread of the three (std
  # 0.020), while training 2.6x faster than 5 layers. A naive "just cut depth"
  # guess could easily have landed on 2 layers, which turned out to be the worst
  # option -- 3 is a genuine sweet spot, not an endpoint of a monotonic trend.
  # Also a plausible contributor to the NaN-divergence investigation's fragility
  # (fewer stacked layers directly shortens the compounding chain implicated
  # there), though that wasn't separately isolated in this comparison.
  # This used a scaled-down diagnostic (3 folds, ~8000-bar training windows, not
  # the full ~11-year history) to keep runtime bounded -- a real directional
  # signal, not the same statistical weight as a full-scale study.
  number_of_cells_per_rnn_layer: [300, 300, 300]
  number_of_cells_per_dense_layer: [7]
  lstm_activation_function: relu
  dense_activation_function: relu
  final_dense_activation_function: softmax
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  loss_function: categorical_crossentropy
  metrics: [accuracy]
  l1_regularization_constant: 0.0001
  l2_regularization_constant: 0.0001
  batch_normalization_momentum: 0.9
  dense_dropout_rate: 0.4
  rnn_dropout_rate: 0.4
  rnn_recurrent_dropout_rate: 0.4
  reduce_lr_on_plateau_factor: 0.9
  reduce_lr_on_plateau_patience: 3
  early_stopping_patience: 8
  # Reverted to 1.0/10.0 (2026-07-10) after a controlled investigation showed
  # tightening these to 0.5/5.0 did NOT fix the NaN divergence first seen on
  # 2026-07-08 -- a faithful repro (same data/seed/model.fit() shuffle order)
  # diverged under BOTH the loose and tight settings, at wildly different and
  # unpredictable points (immediately, ~42% in, ~98% in, or not at all), and this
  # exact architecture's own history already documents two earlier NaN incidents,
  # one of them AFTER gradient clipping was already in place (see model.py's
  # ClipInputs docstring). This looks like genuine, hard-to-fully-eliminate
  # numerical fragility inherent to 5 stacked 300-cell LSTM layers unrolled 200
  # steps deep on real fat-tailed financial data, not a bug traceable to either of
  # these two values specifically. train.py now has TerminateOnNaN (fail fast
  # instead of wasting epochs) and a sub-epoch checkpoint (salvage a diverged
  # run's progress) as the actual mitigations; a clean run is achievable (verified
  # directly) but not guaranteed on the first attempt.
  gradient_clip_norm: 1.0
  input_clip_value: 10.0
  tensorflow_seed: 54
  mlflow_experiment_name: forex-lstm
  mlflow_tracking_uri: "sqlite:///mlflow.db"
