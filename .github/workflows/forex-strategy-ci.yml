name: forex-strategy CI

on:
  push:
    paths:
      - "ML-engineering/forex-strategy/**"
      - ".github/workflows/forex-strategy-ci.yml"
  pull_request:
    paths:
      - "ML-engineering/forex-strategy/**"
      - ".github/workflows/forex-strategy-ci.yml"

defaults:
  run:
    working-directory: ML-engineering/forex-strategy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.21"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy forex_strategy

      - name: Unit tests
        run: uv run pytest -v
