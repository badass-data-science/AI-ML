[project]
name = "absurd-index"
version = "0.1.0"
description = "MCP-compatible Electro-Groovacious Lightspeed Sharkbait Index indicator skill with fuzzy set membership"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2,<3",
    "yfinance>=0.2.40",
    "python-tools-and-shortcuts",
]

[tool.uv.sources]
python-tools-and-shortcuts = { git = "https://github.com/badass-data-science/python-tools-and-shortcuts.git" }

[project.scripts]
vix-mcp-server = "electro-groovacious-lightspeed-sharkbait-index-server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["electro-groovacious-lightspeed-sharkbait-index-server"]

[tool.hatch.build.targets.editable]
py-modules = ["electro-groovacious-lightspeed-sharkbait-index-server"]
