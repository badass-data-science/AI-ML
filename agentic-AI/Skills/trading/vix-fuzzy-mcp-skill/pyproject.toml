[project]
name = "vix-fuzzy-mcp-skill"
version = "0.1.0"
description = "MCP-compatible VIX market volatility indicator skill with fuzzy set membership"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2,<3",
    "vix-fuzzy-shared",
]

[tool.uv.sources]
vix-fuzzy-shared = { path = "../vix_fuzzy_shared", editable = true }

[project.scripts]
vix-mcp-server = "vix_fuzzy_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vix_fuzzy_mcp_server.py"]

[tool.hatch.build.targets.editable]
include = ["vix_fuzzy_mcp_server.py"]
