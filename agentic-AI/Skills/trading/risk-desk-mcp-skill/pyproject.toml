[project]
name = "risk-desk-mcp-skill"
version = "0.1.0"
description = "The Risk Desk — a CLIPS expert system risk gatekeeper for forex LLM agents, exposed as an MCP skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2,<3",
    "clipspy>=1.0.0",
    "vix-fuzzy-shared",
    "oandapyV20>=0.6.3",
]

[tool.uv.sources]
vix-fuzzy-shared = { path = "../vix_fuzzy_shared", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
risk-desk-mcp-server = "risk_desk_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risk_desk_mcp_server"]

[tool.hatch.build.targets.editable]
packages = ["risk_desk_mcp_server"]
