name: forex-ML CI

on:
  push:
    paths:
      - "ML-engineering/forex-ML/**"
      - ".github/workflows/forex-ml-ci.yml"
  pull_request:
    paths:
      - "ML-engineering/forex-ML/**"
      - ".github/workflows/forex-ml-ci.yml"

defaults:
  run:
    working-directory: ML-engineering/forex-ML

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.21"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy forex_ml

      - name: Unit tests
        run: uv run pytest -v -m "not integration"

      - name: Integration tests (real local InfluxDB via Docker)
        run: uv run pytest -v -m integration
