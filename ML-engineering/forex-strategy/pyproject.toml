[project]
name = "forex-strategy"
version = "0.1.0"
description = "Cost-aware trade selection, backtesting, and execution strategy layer built on forex-ML's models"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "mlflow>=2.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tensorflow[and-cuda]>=2.16",
    "keras>=3.0",
    "forex-ml-training",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv.sources]
forex-ml-training = { path = "../forex-ML", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forex_strategy"]
