[project]
name = "oanda-account-mcp-skill"
version = "0.1.0"
description = "MCP skill for querying Oanda v20 account state — balance, weekly drawdown, and open positions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2,<3",
    "oandapyV20>=0.6.3",
]

[project.scripts]
oanda-account-mcp-server = "oanda_account_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["oanda_account_mcp_server"]

[tool.hatch.build.targets.editable]
py-modules = ["oanda_account_mcp_server"]
