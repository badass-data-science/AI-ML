[project]
name = "vix-mcp-skill"
version = "0.1.0"
description = "MCP-compatible VIX market volatility indicator skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2,<3",
    "yfinance>=0.2.40",
]

[project.scripts]
vix-mcp-server = "vix_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["vix_mcp_server"]
