[project]
name = "risk-desk-mcp-skill"
version = "0.1.0"
description = "The Risk Desk — a CLIPS expert system risk gatekeeper for forex LLM agents, exposed as an MCP skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "pydantic>=2,<3",
    "clipspy>=1.0.0",
    "yfinance>=0.2.40",
    "python-tools-and-shortcuts",
    "oandapyV20>=0.6.3",
]

[tool.uv.sources]
python-tools-and-shortcuts = { git = "https://github.com/badass-data-science/python-tools-and-shortcuts.git" }

[project.scripts]
risk-desk-mcp-server = "risk_desk_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["risk_desk_mcp_server"]
artifacts = ["clips_rules/*.clp"]

[tool.hatch.build.targets.editable]
py-modules = ["risk_desk_mcp_server"]
