[project]
name = "vix-fuzzy-shared"
version = "0.1.0"
description = "Shared VIX fuzzy-set constants and classification helpers used across the trading skill suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "python-tools-and-shortcuts",
]

[tool.uv.sources]
python-tools-and-shortcuts = { git = "https://github.com/badass-data-science/python-tools-and-shortcuts.git" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vix_fuzzy_shared"]

[tool.hatch.build.targets.editable]
packages = ["vix_fuzzy_shared"]
